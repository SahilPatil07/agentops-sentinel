[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-digital-worker"
version = "0.1.0"
description = "Enterprise-style simulated incident operations worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
    "langgraph>=1,<2",
    "langsmith>=0.14,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2,<3",
    "pip-tools>=7,<8",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "setuptools>=75",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_worker.tools" = ["seed_data.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
